  assumptions:
  - First-pass screening uses provider metadata and abstracts only.
  - Attention-pattern sparsity is core; KV/token sparsity is tracked as a separate boundary family.
  - Citation counts are metadata, not evidence strength.
  unresolved_questions:
  - Should recurrent memory and state-space models be retained only as dense alternatives or as a separate technical branch?
  - Which KV/token sparsification methods should count as sparse models rather than inference-only compression?
