  - structural sparse attention for long-context language models
  - static and dynamic sparse attention patterns
  - long-context performance, efficiency, memory, and systems evidence
  - failure analysis, reproductions, and strong baselines
  excluded_concepts:
  - generic weight pruning without long-context evidence
  - generic MoE routing without long-context evidence
  - pure retrieval or context compression presented as sparse architecture
  - non-language domains without transferable systems evidence
